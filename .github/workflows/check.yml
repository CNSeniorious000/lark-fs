name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # not a project dependency on purpose -- it ships a node runtime. The [nodejs]
      # extra bundles one, so the check does not depend on what the runner happens to have.
      - run: uvx --from "pyright[nodejs]" pyright
