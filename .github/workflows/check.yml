name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # basedpyright rather than pyright, and through bun rather than as a project
      # dependency: it is a node package, so npm is where it actually lives, and pulling it
      # from PyPI only to get a bundled node runtime with it was the long way round. The
      # config it reads is still `[tool.pyright]` in pyproject.toml.
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bunx basedpyright
