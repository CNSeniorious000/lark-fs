[project]
name = "lark-fs"
version = "0.1.0"
description = "Mirror Feishu/Lark into a greppable, ID-addressed file tree"
readme = "README.md"
authors = [
    { name = "Muspi Merol", email = "me@promplate.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "hmr>=0.7.6.3",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
lark-fs = "lark_fs:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 200
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "N", "W", "UP", "RUF", "FURB", "C4", "ARG", "PIE", "PTH", "RSE", "SIM", "SLF", "B", "FA", "TC", "ISC", "ASYNC", "TRY"]
ignore = ["TC003"]  # Path & friends are used at runtime here, not just in annotations

[tool.pyright]
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

# `m` aliases -- register with: m alias add <name> "<cmd>"
# Kept here so the shortcuts travel with the repo.
[tool.m.aliases]
sync = "uv run --project /Users/muspi-merol/Desktop/lark-fs lark-fs sync"
lark-status = "uv run --project /Users/muspi-merol/Desktop/lark-fs lark-fs status"
